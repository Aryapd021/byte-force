<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="24" fill="#0B1120"/>
  <rect width="798" height="238" x="1" y="1" rx="23" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Brand Symbol / Emblem -->
  <g transform="translate(60, 40)">
    <!-- Outer Shield / Hex Frame -->
    <path d="M 80 10 L 140 42 L 140 108 C 140 138 114 158 80 168 C 46 158 20 138 20 108 L 20 42 Z" 
          fill="url(#shieldGrad)" opacity="0.3" stroke="url(#primaryGradient)" stroke-width="3"/>
    
    <!-- Stylized House Roof with Smart Apex -->
    <path d="M 38 65 L 80 28 L 122 65" fill="none" stroke="url(#primaryGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neural AI Nodes & Energy Core -->
    <line x1="80" y1="45" x2="80" y2="80" stroke="#38BDF8" stroke-width="3" stroke-dasharray="3,3"/>
    <line x1="80" y1="80" x2="52" y2="115" stroke="#06B6D4" stroke-width="3"/>
    <line x1="80" y1="80" x2="108" y2="115" stroke="#06B6D4" stroke-width="3"/>
    <line x1="52" y1="115" x2="80" y2="140" stroke="#2563EB" stroke-width="3"/>
    <line x1="108" y1="115" x2="80" y2="140" stroke="#2563EB" stroke-width="3"/>

    <!-- Glowing Synapse Nodes -->
    <circle cx="80" cy="80" r="7" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="80" cy="80" r="4" fill="#06B6D4"/>
    <circle cx="52" cy="115" r="5" fill="#38BDF8"/>
    <circle cx="108" cy="115" r="5" fill="#38BDF8"/>
    <circle cx="80" cy="140" r="6" fill="#60A5FA"/>

    <!-- Central Power Spark -->
    <path d="M 76 68 L 84 76 L 80 84 L 88 94 L 74 94 L 78 86 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <!-- "BYTE FORCE" -->
  <text x="240" y="112" font-family="'Inter', 'Segoe UI', 'Montserrat', 'sans-serif'" font-weight="900" font-size="56" letter-spacing="3" fill="#FFFFFF">
    BYTE <tspan fill="url(#primaryGradient)">FORCE</tspan>
  </text>

  <!-- Tagline / Sub-brand: "HOMEGENIE AI" -->
  <g transform="translate(245, 145)">
    <rect x="-6" y="-18" width="168" height="26" rx="6" fill="#06B6D4" opacity="0.15"/>
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', 'sans-serif'" font-weight="700" font-size="16" letter-spacing="4" fill="#38BDF8">
      HOMEGENIE
    </text>
    <rect x="120" y="-14" width="34" height="18" rx="4" fill="#2563EB"/>
    <text x="126" y="0" font-family="'Inter', 'Segoe UI', 'sans-serif'" font-weight="800" font-size="12" letter-spacing="1" fill="#FFFFFF">
      AI
    </text>
    <text x="175" y="0" font-family="'Inter', 'Segoe UI', 'sans-serif'" font-weight="500" font-size="14" letter-spacing="1.5" fill="#94A3B8">
      • SMART PREDICTIVE MAINTENANCE
    </text>
  </g>
</svg>
