<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="shieldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>
  <rect width="798" height="238" x="1" y="1" rx="23" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Brand Symbol / Emblem -->
  <g transform="translate(60, 40)">
    <!-- Outer Shield / Hex Frame -->
    <path d="M 80 10 L 140 42 L 140 108 C 140 138 114 158 80 168 C 46 158 20 138 20 108 L 20 42 Z" 
          fill="url(#shieldGradLight)" stroke="url(#primaryGradientLight)" stroke-width="3"/>
    
    <!-- Stylized House Roof with Smart Apex -->
    <path d="M 38 65 L 80 28 L 122 65" fill="none" stroke="url(#primaryGradientLight)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neural AI Nodes & Energy Core -->
    <line x1="80" y1="45" x2="80" y2="80" stroke="#0284C7" stroke-width="3" stroke-dasharray="3,3"/>
    <line x1="80" y1="80" x2="52" y2="115" stroke="#0891B2" stroke-width="3"/>
    <line x1="80" y1="80" x2="108" y2="115" stroke="#0891B2" stroke-width="3"/>
    <line x1="52" y1="115" x2="80" y2="140" stroke="#1D4ED8" stroke-width="3"/>
    <line x1="108" y1="115" x2="80" y2="140" stroke="#1D4ED8" stroke-width="3"/>

    <!-- Synapse Nodes -->
    <circle cx="80" cy="80" r="7" fill="#1E293B"/>
    <circle cx="80" cy="80" r="4" fill="#06B6D4"/>
    <circle cx="52" cy="115" r="5" fill="#0284C7"/>
    <circle cx="108" cy="115" r="5" fill="#0284C7"/>
    <circle cx="80" cy="140" r="6" fill="#1D4ED8"/>

    <!-- Central Spark -->
    <path d="M 76 68 L 84 76 L 80 84 L 88 94 L 74 94 L 78 86 Z" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <!-- "BYTE FORCE" -->
  <text x="240" y="112" font-family="'Inter', 'Segoe UI', 'Montserrat', 'sans-serif'" font-weight="900" font-size="56" letter-spacing="3" fill="#0F172A">
    BYTE <tspan fill="url(#primaryGradientLight)">FORCE</tspan>
  </text>

  <!-- Tagline / Sub-brand: "HOMEGENIE AI" -->
  <g transform="translate(245, 145)">
    <rect x="-6" y="-18" width="168" height="26" rx="6" fill="#E0F2FE"/>
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', 'sans-serif'" font-weight="700" font-size="16" letter-spacing="4" fill="#0284C7">
      HOMEGENIE
    </text>
    <rect x="120" y="-14" width="34" height="18" rx="4" fill="#1D4ED8"/>
    <text x="126" y="0" font-family="'Inter', 'Segoe UI', 'sans-serif'" font-weight="800" font-size="12" letter-spacing="1" fill="#FFFFFF">
      AI
    </text>
    <text x="175" y="0" font-family="'Inter', 'Segoe UI', 'sans-serif'" font-weight="600" font-size="14" letter-spacing="1.5" fill="#64748B">
      • SMART PREDICTIVE MAINTENANCE
    </text>
  </g>
</svg>
