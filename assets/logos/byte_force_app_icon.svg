<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="112" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Protective Hex Shield Outline -->
  <path d="M 256 70 L 410 145 L 410 290 C 410 360 345 410 256 440 C 167 410 102 360 102 290 L 102 145 Z" 
        fill="#06B6D4" fill-opacity="0.08" stroke="url(#neonGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Stylized House Roof -->
  <path d="M 148 200 L 256 105 L 364 200" fill="none" stroke="url(#neonGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- AI Neural Network Circuitry -->
  <line x1="256" y1="145" x2="256" y2="230" stroke="#38BDF8" stroke-width="8" stroke-dasharray="8,8"/>
  <line x1="256" y1="230" x2="180" y2="310" stroke="#06B6D4" stroke-width="7"/>
  <line x1="256" y1="230" x2="332" y2="310" stroke="#06B6D4" stroke-width="7"/>
  <line x1="180" y1="310" x2="256" y2="375" stroke="#2563EB" stroke-width="8"/>
  <line x1="332" y1="310" x2="256" y2="375" stroke="#2563EB" stroke-width="8"/>

  <!-- Core Synapses -->
  <circle cx="256" cy="230" r="18" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="256" cy="230" r="10" fill="#06B6D4"/>

  <circle cx="180" cy="310" r="14" fill="#38BDF8"/>
  <circle cx="332" cy="310" r="14" fill="#38BDF8"/>
  <circle cx="256" cy="375" r="16" fill="#60A5FA"/>

  <!-- Central Energy Lightning Bolt -->
  <polygon points="250,195 268,220 258,235 275,265 242,265 252,240 242,230" fill="#FFFFFF"/>
</svg>
