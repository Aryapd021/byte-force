<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #101828;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1200px;
      height: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 30px;
    }
    .bf-badge {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(6, 182, 212, 0.4);
    }
    .bf-text {
      color: #FFFFFF;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: -1px;
    }
    .brand-name {
      font-size: 68px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -1px;
      line-height: 1.1;
    }
    .force-accent {
      color: #06B6D4;
    }
    .sub-brand {
      font-size: 18px;
      font-weight: 700;
      color: #60A5FA;
      letter-spacing: 5px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="bf-badge">
      <span class="bf-text">BF</span>
    </div>
    <div>
      <div class="brand-name">Byte<span class="force-accent">Force</span></div>
      <div class="sub-brand">HOMEGENIE AI</div>
    </div>
  </div>
</body>
</html>
