<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Exact Webpage Tailwind Gradient: from-secondary (#2563EB) to-accent (#06B6D4) -->
    <linearGradient id="webIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Webpage Gradient Rounded Box -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#webIconGradient)" filter="url(#iconShadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="18" y="18" width="220" height="220" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" />

  <!-- Exact "BF" text inside the box -->
  <text x="128" y="166" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="118" fill="#FFFFFF" text-anchor="middle" letter-spacing="-3">BF</text>
</svg>
